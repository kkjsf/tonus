<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonus</title>
<meta name="description" content="Abdos, gainage et musculation à la maison : 10 minutes chrono par jour, avec poignées de pompes et haltères.">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tonus">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f5f3ef; --card: #fff; --card2: #f0ece6; --ink: #1c1a22; --muted: #6c6875; --faint: #9a96a2; --line: #e6e1da;
  --shadow: 0 1px 2px rgba(28, 26, 34, .05), 0 8px 24px rgba(28, 26, 34, .07);
  --db: #55525c; --hdl: #8d8994;
  --push: #f05a3a; --pull: #7c4dff; --core: #0d9e8c; --abs: #e98600; --upper: #2f6fe4; --mob: #1f9d55;
  --accent: #f05a3a; --fig: var(--ink);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --card: #181b24; --card2: #20242f; --ink: #f3f1ee; --muted: #a19dab; --faint: #6f6b7a; --line: #2a2e3a;
    --shadow: none; --db: #cfccd6; --hdl: #8b8796;
    --push: #ff7452; --pull: #9d7bff; --core: #2cc9b4; --abs: #ffa62b; --upper: #5a95ff; --mob: #3fcf7a;
    --accent: #ff7452;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --card: #181b24; --card2: #20242f; --ink: #f3f1ee; --muted: #a19dab; --faint: #6f6b7a; --line: #2a2e3a;
  --shadow: none; --db: #cfccd6; --hdl: #8b8796;
  --push: #ff7452; --pull: #9d7bff; --core: #2cc9b4; --abs: #ffa62b; --upper: #5a95ff; --mob: #3fcf7a;
  --accent: #ff7452;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
ol, ul { list-style: none; }
[hidden] { display: none !important; }

#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 96px); }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
.brand { display: flex; gap: 11px; align-items: center; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.brand b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.brand small { display: block; color: var(--muted); font-size: 13px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--card2); }

.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
h2 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 750; margin: 18px 0 8px; }
.muted { color: var(--muted); }
.card { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); margin-top: 14px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head .muted { font-size: 14px; }
.lead { color: var(--muted); font-size: 15px; margin-top: 4px; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px; color: #fff; margin-top: 4px;
  background: linear-gradient(145deg, var(--acc) 0%, color-mix(in srgb, var(--acc) 58%, #160c2a) 100%);
  box-shadow: 0 14px 34px color-mix(in srgb, var(--acc) 30%, transparent);
  display: grid; grid-template-columns: 1fr 44%; column-gap: 8px; }
.hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .22), transparent 65%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero-txt { grid-column: 1; }
.hero .fig { grid-column: 2; grid-row: 1; align-self: center; --fig: #fff; --bgf: transparent; --db: rgba(255, 255, 255, .8); --hdl: rgba(255, 255, 255, .55); --floor: rgba(255, 255, 255, .25); --mat: rgba(255, 255, 255, .16); }
.hero-full { grid-column: 1 / -1; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; background: rgba(255, 255, 255, .2); padding: 4px 10px; border-radius: 99px; }
.hero h1 { font-size: 29px; line-height: 1.08; font-weight: 850; letter-spacing: -.03em; margin: 12px 0 8px; text-wrap: balance; }
.hero-desc { font-size: 14.5px; opacity: .9; text-wrap: pretty; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 14px; font-weight: 650; }
.hero-meta span { display: inline-flex; align-items: center; gap: 5px; }
.hero-meta svg.i { width: 17px; height: 17px; }
.hero-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.hero-link { font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; opacity: .92; padding: 6px 2px; }
.seg { display: inline-flex; background: rgba(0, 0, 0, .2); border-radius: 12px; padding: 3px; }
.seg button { padding: 7px 14px; border-radius: 9px; font-size: 14px; font-weight: 700; opacity: .8; }
.seg button[aria-pressed="true"] { background: #fff; color: color-mix(in srgb, var(--acc) 75%, #000); opacity: 1; }
.go { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 18px; background: #fff;
  color: color-mix(in srgb, var(--acc) 78%, #000); font-weight: 800; font-size: 18px; margin-top: 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); transition: transform .15s; }
.go:active { transform: scale(.97); }
.go svg.i { fill: currentColor; stroke: none; width: 20px; height: 20px; }
.go.ghost { background: rgba(255, 255, 255, .18); color: #fff; box-shadow: none; font-size: 16px; height: 50px; }
.eq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.eq span { font-size: 12.5px; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .16); }

/* ---------- today ---------- */
.week .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.day span { display: block; font-size: 12px; font-weight: 650; color: var(--faint); margin-bottom: 6px; }
.day i { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; background: var(--card2); font-style: normal; font-size: 15px; color: #fff; font-weight: 800; }
.day.done i { background: var(--c); }
.day.today i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.day.today span { color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.tile { background: var(--card); border-radius: 18px; padding: 14px 12px; box-shadow: var(--shadow); }
.tile b { display: block; font-size: 24px; font-weight: 850; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile small { color: var(--muted); font-size: 12.5px; }
.tiles.four { grid-template-columns: repeat(2, 1fr); }
.exlist li { display: flex; align-items: center; gap: 12px; padding: 7px 0; cursor: pointer; }
.exlist li + li { border-top: 1px solid var(--line); }
.thumb { width: 72px; flex: none; border-radius: 14px; background: var(--bgf); }
.exl-n { width: 22px; flex: none; text-align: center; font-weight: 800; color: var(--faint); font-size: 14px; font-variant-numeric: tabular-nums; }
.exl-txt { flex: 1; min-width: 0; }
.exl-txt b { display: block; font-size: 15px; font-weight: 700; line-height: 1.25; }
.exl-txt small { color: var(--muted); font-size: 13px; }
.side { font-weight: 600; color: var(--muted); }
.kg { flex: none; font-size: 13px; font-weight: 750; padding: 6px 10px; border-radius: 10px; background: var(--card2); color: var(--ink); font-variant-numeric: tabular-nums; }
.kg.unset { color: var(--muted); }
.phase-line { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); padding: 8px 0; }
.phase-line b { color: var(--ink); font-weight: 700; }
.phase-line .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mob); flex: none; margin: 0 7px; }
.banner { display: flex; gap: 12px; align-items: center; border-radius: 18px; padding: 14px 16px; margin-top: 14px; background: color-mix(in srgb, var(--mob) 14%, var(--card)); }
.banner p { flex: 1; font-size: 14.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 13px; font-weight: 750; font-size: 15px; background: var(--card2); }
.btn.pri { background: var(--ink); color: var(--bg); }
.btn.danger { background: #d8432f; color: #fff; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; }
.lvls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.lvl { border-radius: 16px; padding: 12px 6px; background: var(--card2); text-align: center; border: 2px solid transparent; transition: border-color .15s; }
.lvl b { display: block; font-size: 22px; font-weight: 850; line-height: 1.1; }
.lvl span { display: block; font-size: 12px; font-weight: 700; margin-top: 2px; }
.lvl small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }

/* ---------- programme ---------- */
.tl { display: flex; gap: 2px; height: 16px; border-radius: 6px; overflow: hidden; margin: 14px 0 8px; }
.tl i { display: block; }
.tl .w { background: var(--mob); } .tl .r { background: var(--line); } .tl .x { background: var(--accent); }
.tl-leg { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); gap: 8px; }
.steps { margin-top: 14px; display: grid; gap: 10px; }
.steps li { display: flex; gap: 12px; font-size: 14.5px; }
.steps li b { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--card2); font-size: 13px; }
.sess { position: relative; padding-left: 22px; overflow: hidden; }
.sess::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--acc); }
.sess-head { display: flex; align-items: center; gap: 10px; }
.sess-head h2 { flex: 1; }
.badge { font-size: 11.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, var(--acc) 16%, var(--card)); color: color-mix(in srgb, var(--acc) 80%, var(--ink)); }
.sess p { font-size: 14.5px; color: var(--muted); margin-top: 4px; }
.sess-ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sess-ex span { font-size: 12.5px; padding: 3px 9px; border-radius: 99px; background: var(--card2); }
.sess .btn { margin-top: 12px; background: var(--acc); color: #fff; }
.sess .btn svg.i { fill: currentColor; stroke: none; width: 16px; height: 16px; }
.tips li { position: relative; padding-left: 20px; font-size: 14.5px; margin-top: 9px; text-wrap: pretty; }
.tips li::before { content: ""; position: absolute; left: 3px; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* ---------- bibliotheque ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; margin-top: 14px; scrollbar-width: none; }
.chips button { flex: none; padding: 8px 14px; border-radius: 99px; font-size: 14px; font-weight: 700; background: var(--card); box-shadow: var(--shadow); color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
.excard { background: var(--card); border-radius: 20px; padding: 8px 8px 12px; box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; }
.excard .fig { border-radius: 14px; background: var(--bgf); }
.excard b { font-size: 14.5px; font-weight: 750; margin: 9px 4px 0; line-height: 1.25; }
.excard small { font-size: 12.5px; color: var(--muted); margin: 2px 4px 0; }

/* ---------- progres ---------- */
.heat-m { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.heat-m span { white-space: nowrap; overflow: visible; }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--card2); }
.heat i.on { background: var(--c); }
.heat i.fut { background: transparent; }
.heat i.now { box-shadow: inset 0 0 0 2px var(--ink); }
.bars li { display: grid; grid-template-columns: 112px 1fr 26px; align-items: center; gap: 10px; font-size: 14px; margin-top: 8px; }
.bars i { display: block; height: 10px; border-radius: 5px; background: var(--acc); min-width: 3px; }
.bars em { font-style: normal; font-weight: 750; text-align: right; font-variant-numeric: tabular-nums; }
.hist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.hist li + li { border-top: 1px solid var(--line); }
.hist .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--acc); }
.hist div { flex: 1; min-width: 0; }
.hist b { display: block; font-size: 15px; font-weight: 700; }
.hist small { color: var(--muted); font-size: 13px; }
.hist .feel { font-size: 20px; }
.del { width: 32px; height: 32px; border-radius: 10px; color: var(--faint); display: grid; place-items: center; }
.del svg.i { width: 16px; height: 16px; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 15px; }
.empty b { display: block; font-size: 36px; margin-bottom: 6px; }

/* ---------- navigation ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; gap: 4px;
  background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); }
.tabs button { flex: 1; max-width: 130px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 650; color: var(--faint); padding: 6px 0 4px; border-radius: 14px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] svg.i { color: var(--accent); }

/* ---------- figure ---------- */
.fig { display: block; aspect-ratio: 4 / 3; overflow: hidden; --bgf: color-mix(in srgb, var(--fig) 10%, var(--card)); }
.fig svg { display: block; width: 100%; height: 100%; }
.f-near, .f-far, .f-torso, .f-neck { fill: none; stroke: var(--fig); stroke-linecap: round; stroke-linejoin: round; }
.f-near, .f-far { stroke-width: 4.2; }
.f-far { opacity: .4; }
.f-torso { stroke-width: 5.4; }
.f-neck { stroke-width: 3.4; }
.f-head { fill: var(--fig); }
.f-halo { fill: none; stroke: var(--bgf); stroke-width: 7.4; stroke-linecap: round; stroke-linejoin: round; }
.f-db { fill: var(--db); stroke: var(--db); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.f-far-db { opacity: .55; }
.f-floor { stroke: var(--floor, var(--line)); stroke-width: 1; }
.f-mat { fill: var(--mat, color-mix(in srgb, var(--fig) 16%, transparent)); }
.f-hdl { fill: none; stroke: var(--hdl); stroke-width: 1.6; stroke-linejoin: round; }

/* ---------- feuille du bas ---------- */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(8, 8, 14, .5); animation: bgin .2s ease; }
@keyframes bgin { from { opacity: 0; } }
.sheet-card { position: relative; width: 100%; max-width: 560px; max-height: 90dvh; overflow-y: auto; background: var(--card); border-radius: 26px 26px 0 0;
  padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px); animation: up .28s cubic-bezier(.2, .9, .3, 1); overscroll-behavior: contain; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.sheet-x { position: absolute; right: 10px; top: 10px; }
.sheet-fig { margin: 8px 0 14px; }
.sheet-fig .fig { border-radius: 20px; background: var(--bgf); }
.sheet h2 { font-size: 22px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tags span { font-size: 12.5px; font-weight: 650; padding: 4px 10px; border-radius: 99px; background: var(--card2); }
.cues { counter-reset: c; display: grid; gap: 9px; }
.cues li { counter-increment: c; display: flex; gap: 10px; font-size: 15px; }
.cues li::before { content: counter(c); flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--fig); color: var(--card); font-size: 13px; font-weight: 800; }
.tip { border-radius: 14px; padding: 11px 13px; background: var(--card2); font-size: 14px; margin-top: 10px; }
.tip b { display: block; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.tip.warn b { color: #d8432f; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .tip { margin-top: 10px; }
.kgbox { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 16px; background: var(--card2); }
.kgbox span { flex: 1; font-weight: 700; }
.kgbox b { min-width: 68px; text-align: center; font-size: 20px; font-variant-numeric: tabular-nums; }
.kgbox button { width: 40px; height: 40px; border-radius: 12px; background: var(--card); font-size: 22px; font-weight: 700; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.presets button { padding: 6px 11px; border-radius: 10px; background: var(--card2); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.presets button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pick li { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; cursor: pointer; }
.pick li:hover { background: var(--card2); }
.pick .em { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: color-mix(in srgb, var(--acc) 18%, var(--card)); flex: none; }
.pick div { flex: 1; }
.pick b { display: block; font-weight: 750; }
.pick small { color: var(--muted); font-size: 13px; }
.set li { display: flex; align-items: center; gap: 12px; padding: 13px 0; }
.set li + li { border-top: 1px solid var(--line); }
.set li > div { flex: 1; }
.set small { display: block; color: var(--muted); font-size: 13px; }
.sw { position: relative; width: 50px; height: 30px; border-radius: 15px; background: var(--line); transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--mob); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.seg2 { display: inline-flex; background: var(--card2); border-radius: 12px; padding: 3px; }
.seg2 button { padding: 6px 11px; border-radius: 9px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.ver { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 18px; }

/* ---------- lecteur de seance ---------- */
.player { position: fixed; inset: 0; z-index: 40; overflow: hidden;
  background: radial-gradient(130% 60% at 50% -5%, color-mix(in srgb, var(--acc) 34%, transparent), transparent 72%), var(--bg); }
.pl-in { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 12px); }
.pl-top { display: flex; align-items: center; gap: 10px; }
.pl-bar { flex: 1; display: flex; gap: 3px; height: 6px; }
.pl-bar i { display: block; height: 100%; border-radius: 3px; background: color-mix(in srgb, var(--ink) 14%, transparent); overflow: hidden; }
.pl-bar i::after { content: ""; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--seg, var(--acc)); }
.pl-bar i.w { --seg: var(--mob); }

<script>
'use strict';
const APP_VERSION = '2';
const APP_BUILT = '04/11/2026 10h33';
const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- moteur du bonhomme : cinematique inverse a deux os, vue de profil, y vers le haut, sol en y = 0 ---------- */
const LEN = { torso: 20, neck: 6.5, ua: 11, fa: 10, th: 14, sh: 14 };
const HEAD_R = 4.6;
const RAD = Math.PI / 180;
const at = (p, a, r) => [p[0] + Math.cos(a * RAD) * r, p[1] + Math.sin(a * RAD) * r];
const angTo = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) / RAD;
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const lerp = (a, b, k) => a + (b - a) * k;
const lerpA = (a, b, k) => a + ((((b - a) % 360) + 540) % 360 - 180) * k;
const shoulder = (h, t) => at(h, t, LEN.torso);
const ease = k => (1 - Math.cos(Math.PI * k)) / 2;

// sign : +1 = articulation du cote anti-horaire de la ligne racine -> cible
function ik(root, target, a, b, sign) {
  const d = Math.min(Math.max(dist(root, target), Math.abs(a - b) + .01), a + b - .01);
  const u = angTo(root, target) + sign * Math.acos((a * a + d * d - b * b) / (2 * a * d)) / RAD;
  return [u, angTo(at(root, u, a), target)];
}

function prep(p) {
  const s = shoulder(p.h, p.t);
  const eff = [p.hn, p.hf || p.hn, p.fn, p.ff || p.fn];
  const sg = [p.eb ?? -1, p.ebf ?? p.eb ?? -1, p.kb ?? 1, p.kbf ?? p.kb ?? 1];
  return { h: p.h, t: p.t, hd: p.hd ?? p.t, limbs: eff.map((e, i) => {
    const leg = i > 1, [u, l] = ik(leg ? p.h : s, e, leg ? LEN.th : LEN.ua, leg ? LEN.sh : LEN.fa, sg[i]);
    return { e, sg: sg[i], u, l };
  }) };
}

// Un appui fixe (meme point dans les deux poses) reste colle au sol ; sinon on interpole les angles.
function blend(A, B, k, world) {
  const h = [lerp(A.h[0], B.h[0], k), lerp(A.h[1], B.h[1], k)], s = shoulder(h, lerpA(A.t, B.t, k));
  const limbs = A.limbs.map((la, i) => {
    const lb = B.limbs[i], leg = i > 1, root = leg ? h : s, a = leg ? LEN.th : LEN.ua, b = leg ? LEN.sh : LEN.fa;
    const [u, l] = world || dist(la.e, lb.e) < .01 ? ik(root, [lerp(la.e[0], lb.e[0], k), lerp(la.e[1], lb.e[1], k)], a, b, la.sg) : [lerpA(la.u, lb.u, k), lerpA(la.l, lb.l, k)];
    const j = at(root, u, a);
    return [root, j, at(j, l, b)];
  });
  return { h, s, head: at(s, lerpA(A.hd, B.hd, k), LEN.neck), limbs };
}

function prepEx(ex) {
  if (ex._F) return ex;
  ex._F = ex.frames.map(prep);
  ex._T = Array.isArray(ex.tempo) ? ex.tempo : ex.frames.map(() => ex.tempo);
  ex._len = ex._T.reduce((a, b) => a + b, 0);
  let x0 = 1e9, x1 = -1e9, y1 = -1e9;
  const grow = (p, r) => { x0 = Math.min(x0, p[0] - r); x1 = Math.max(x1, p[0] + r); y1 = Math.max(y1, p[1] + r); };
  ex._F.forEach((A, i) => {
    const B = ex._F[(i + 1) % ex._F.length];
    for (let k = 0; k <= 1; k += .25) {
      const q = blend(A, B, k, ex.world);
      grow(q.h, 3); grow(q.s, 3); grow(q.head, HEAD_R + 1);
      q.limbs.forEach(l => { grow(l[1], 2.5); grow(l[2], ex.db ? 4.5 : 2.5); });
    }
  });
  const fy = ex.mat ? 1.4 : 2, bot = fy + 3;
  let W = x1 - x0 + 10, H = y1 + 5 + bot;
  if (W < H * 4 / 3) W = H * 4 / 3; else H = W * 3 / 4;
  ex._vb = [(x0 + x1) / 2 - W / 2, bot - H, W, H];
  ex._fy = fy;
  ex._bb = [x0, x1];
  return ex;
}

function poseAt(ex, time) {
  let t = time % ex._len, i = 0;
  while (t > ex._T[i] && i < ex._T.length - 1) { t -= ex._T[i]; i++; }
  return blend(ex._F[i], ex._F[(i + 1) % ex._F.length], ease(Math.min(t / ex._T[i], 1)), ex.world);
}

const P = p => `${p[0].toFixed(2)},${(-p[1]).toFixed(2)}`;
function dbPath(j, e, big) {
  const L = dist(j, e) || 1, u = [(e[0] - j[0]) / L, (e[1] - j[1]) / L], n = [-u[1], u[0]];
  const hw = big ? 3.4 : 2.8, pl = big ? 2.8 : 2.3, pw = 1;
  const pt = (s, a, b) => [e[0] + n[0] * (s + b) + u[0] * a, e[1] + n[1] * (s + b) + u[1] * a];
  let d = `M${P(pt(-hw, 0, 0))}L${P(pt(hw, 0, 0))}`;
  for (const s of [-hw, hw]) d += `M${P(pt(s, -pl, -pw))}L${P(pt(s, pl, -pw))}L${P(pt(s, pl, pw))}L${P(pt(s, -pl, pw))}Z`;
  return d;
}

function figMarkup(ex, mirror) {
  const [x, y, w, hgt] = ex._vb, fy = ex._fy;
  let props = '';
  if (ex.mat) props += `<rect class="f-mat" x="${(ex._bb[0] - 2).toFixed(1)}" y="0" width="${(ex._bb[1] - ex._bb[0] + 4).toFixed(1)}" height="1.4" rx=".7"/>`;
  if (ex.handles) { const hx = ex.frames[0].hn[0]; props += `<path class="f-hdl" d="M${hx - 3.4} 0L${hx - 2.2} -4H${hx + 2.2}L${hx + 3.4} 0"/>`; }
  return `<svg viewBox="${(mirror ? -(x + w) : x).toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${hgt.toFixed(1)}" aria-hidden="true"><g${mirror ? ' transform="scale(-1 1)"' : ''}>`
    + `<line class="f-floor" x1="${x.toFixed(1)}" x2="${(x + w).toFixed(1)}" y1="${fy}" y2="${fy}"/>${props}`
    + '<path class="f-far"/><path class="f-db f-far-db"/><path class="f-far"/><path class="f-torso"/><path class="f-neck"/>'
    + `<circle class="f-head" r="${HEAD_R}"/><path class="f-halo"/><path class="f-near"/><path class="f-halo"/><path class="f-near"/><path class="f-db"/></g></svg>`;
}

const figs = new Set();
function mountFigs(root) {
  root.querySelectorAll('.fig[data-ex]:not([data-on])').forEach(el => {
    const ex = prepEx(EX[el.dataset.ex]);
    el.dataset.on = '1';
    el.innerHTML = figMarkup(ex, el.dataset.m === '1');
    const far = el.querySelectorAll('.f-far'), near = el.querySelectorAll('.f-near'), db = el.querySelectorAll('.f-db'), halo = el.querySelectorAll('.f-halo');
    const f = { el, ex, armF: far[0], legF: far[1], legN: near[0], armN: near[1], dbF: db[0], dbN: db[1], haloL: halo[0], haloA: halo[1],
      torso: el.querySelector('.f-torso'), neck: el.querySelector('.f-neck'), head: el.querySelector('.f-head'), hold: false };
    drawFig(f, poseAt(ex, ex._T[0]));
    if (!REDUCED) figs.add(f);
    el._fig = f;
  });
}

function drawFig(f, q) {
  const seg = l => `M${P(l[0])}L${P(l[1])}L${P(l[2])}`, [an, af, ln, lf] = q.limbs, db = f.ex.db;
  // le liseré part du milieu du segment pour ne pas couper le buste a l'attache
  const halo = l => `M${P([lerp(l[0][0], l[1][0], .4), lerp(l[0][1], l[1][1], .4)])}L${P(l[1])}L${P(l[2])}`;
  f.armF.setAttribute('d', seg(af));
  f.legF.setAttribute('d', seg(lf));
  f.legN.setAttribute('d', seg(ln));
  f.armN.setAttribute('d', seg(an));
  f.haloL.setAttribute('d', halo(ln));
  f.haloA.setAttribute('d', halo(an));
  f.torso.setAttribute('d', `M${P(q.h)}L${P(q.s)}`);
  f.neck.setAttribute('d', `M${P(q.s)}L${P(q.head)}`);
  f.head.setAttribute('cx', q.head[0].toFixed(2));
  f.head.setAttribute('cy', (-q.head[1]).toFixed(2));
  f.dbN.setAttribute('d', db ? dbPath(an[1], an[2], db === 'one') : '');
  f.dbF.setAttribute('d', db === 'both' ? dbPath(af[1], af[2]) : '');
}

const T0 = performance.now();
function animate(now) {
  const t = (now - T0) / 1000;
  for (const f of figs) {
    if (!f.el.isConnected) { figs.delete(f); continue; }
    if (!f.hold) drawFig(f, poseAt(f.ex, t));
  }
  if (run && !run.over) drawRing(now);
  requestAnimationFrame(animate);
}

/* ---------- les poses ---------- */
const o = (...a) => Object.assign({}, ...a);
const STAND = { h: [0, 27.9], t: 90, fn: [0.6, 0], ff: [-0.6, 0] };
const SH = shoulder(STAND.h, 90);
const FRONT = { h: [0, 27.9], t: 90, fn: [-2.5, 0], ff: [2.5, 0], kb: -1, kbf: 1 };
const HIP = [0, 2.5];
const LIE = { h: HIP, t: 180, hd: 163 };
const S_LIE = shoulder(HIP, 180);
const ALONG = [1.2, 2.4];
const KNEES = [16, 1.6];
const ARM_UP = [-20, 23.8];
const PLANK = { h: [0.5, 8.4], t: 13.3, hn: [30, 2], fn: [-26.75, 1.96] };
const HPLANK = { h: [4.02, 13.85], t: 25.94, hn: [22, 1.6] };
const BACK = [-21.16, 1.6];
const PUSH_TOP = { h: [4.53, 15.25], t: 29.18, hn: [24.5, 4], fn: [-19.9, 1.6] };
const PUSH_BOT = { h: [7.72, 6.21], t: 9.47, hn: [24.5, 4], fn: [-19.9, 1.6] };
const QUAD = { h: [-6, 15.6], t: 20.5 }, Q_HAND = [12.73, 1.6], Q_FOOT = [-20, 1.6];
const RENEG = { h: [4.42, 14.96], t: 28.5, fn: [-20.18, 1.6] }, R_HAND = [22, 3.5], R_ROW = [12.5, 14];
const BIKE = { h: HIP, hd: 130, hn: [-20.5, 17.5] };
const FLUT = { h: HIP, t: 176, hd: 160, hn: ALONG };
const SEAT = { h: [0, 3], fn: [-9, 3.5], ff: [9, 3.5], kb: -1, kbf: 1 };
const ROW = { h: [-3, 25.8], t: 38, hd: 20, fn: [1, 0], ff: [-1, 0] };
const ROW1 = { h: [-4, 25], t: 30, hd: 12, fn: [-7, 0], ff: [7, 0], hf: [5, 15.5] };
const PRESS_LIE = o(LIE, { fn: KNEES });
const circle = [...Array(8)].map((_, i) => o(STAND, { hn: at(SH, -90 + 45 * i, 22), hf: at(SH, 90 + 45 * i, 22) }));

/* ---------- les exercices ---------- */
const EX = {
  jumping_jacks: { name: 'Jumping jacks', cat: 'mob', mus: 'Cardio, échauffement', eq: 'none',
    cues: ['Saute en écartant bras et jambes', 'Reviens pieds joints, bras le long du corps', 'Reste souple, sur l\'avant des pieds'],
    err: 'Retomber talons tendus et genoux verrouillés.', easy: 'Sans sauter : un pas sur le côté à chaque fois.', hard: 'Plus vite, ou descends en demi-squat en écartant.',
    frames: [
      { h: [0, 27.9], t: 90, hn: [-6.5, 27.4], hf: [6.5, 27.4], eb: -1, ebf: 1, fn: [-2.5, 0], ff: [2.5, 0], kb: -1, kbf: 1 },
      { h: [0, 26], t: 90, hn: [-12, 67], hf: [12, 67], eb: -1, ebf: 1, fn: [-10.5, 0], ff: [10.5, 0], kb: -1, kbf: 1 }],
    tempo: .42 },
  arm_circles: { name: 'Moulinets de bras', cat: 'mob', mus: 'Épaules, échauffement', eq: 'none',
    cues: ['Grands cercles, bras tendus', 'Un bras après l\'autre, comme en crawl', 'Change de sens à mi-temps'],
    err: 'Hausser les épaules vers les oreilles.', easy: 'Petits cercles.', hard: 'Cercles plus grands et plus rapides.',
    frames: circle, tempo: .2 },
  cobra: { name: 'Cobra', cat: 'mob', mus: 'Étirement des abdos', eq: 'none', mat: true,
    cues: ['À plat ventre, mains sous les épaules', 'Pousse doucement pour relever le buste, hanches au sol', 'Respire profondément, relâche les fessiers'],
    err: 'Forcer dans le bas du dos.', easy: 'Sur les avant-bras (sphinx).', hard: 'Bras plus tendus, si le dos le permet.',
    frames: [
      { h: HIP, t: 30, hd: 45, hn: [19, 1.8], fn: [-27.9, 2.2] },
      { h: HIP, t: 35, hd: 52, hn: [19, 1.8], fn: [-27.9, 2.2] }],
    tempo: 2.2 },
  child_pose: { name: 'Posture de l\'enfant', cat: 'mob', mus: 'Étirement du dos', eq: 'none', mat: true,
    cues: ['Assis sur les talons, genoux un peu écartés', 'Buste vers l\'avant, bras tendus devant', 'Relâche tout et respire lentement'],
    err: 'Retenir sa respiration.', easy: 'Un coussin sous les fesses.', hard: 'Allonge les bras plus loin.',
    frames: [
      { h: [-5.5, 8.5], t: -8, hd: -2, hn: [34, 2.2], fn: [-8, 1.6] },
      { h: [-5.5, 9.1], t: -7, hd: -1, hn: [34, 2.2], fn: [-8, 1.6] }],
    tempo: 2.2 },

  plank: { name: 'Planche', cat: 'core', mus: 'Abdos profonds, épaules', eq: 'none', mat: true,
    cues: ['Coudes sous les épaules, avant-bras au sol', 'Rentre le nombril, serre les fessiers', 'Respire calmement, ne bloque pas'],
    err: 'Bassin qui s\'affaisse ou qui monte en pointe.', easy: 'Sur les genoux.', hard: 'Décolle un pied, ou recule un peu les coudes.',
    frames: [PLANK, o(PLANK, { h: [0.5, 8.9], t: 12.6 })], tempo: 1.8 },
  side_plank: { name: 'Planche latérale', cat: 'core', mus: 'Obliques, épaules', eq: 'none', mat: true,
    cues: ['Coude sous l\'épaule, pieds empilés', 'Corps aligné, bassin bien haut', 'Bras du dessus tendu vers le plafond'],
    err: 'Bassin qui tombe vers le sol.', easy: 'Genou du dessous posé au sol.', hard: 'Lève la jambe du dessus.',

  crunch: { name: 'Crunch', cat: 'core', mus: 'Grand droit', eq: 'none', mat: true,

  { n: 1, name: 'Découverte', work: 30, rest: 30, reps: 8 },

// La muscu se compte en répétitions (on appuie sur « Fait »), les abdos et le gainage au chrono.
const isReps = id => EX[id].cat === 'push' || EX[id].cat === 'pull';
const repsFor = (id, lvN) => EX[id].reps ? EX[id].reps[lvN - 1] : LEVELS[lvN - 1].reps;
const SEC_PER_REP = 2.7;
const counted = s => s.k === 'work' && s.reps > 0;
const WARM = { full: [['jumping_jacks', 30], ['arm_circles', 30]], express: [['jumping_jacks', 30]] };
const COOL = { full: [['cobra', 25], ['child_pose', 25]], express: [['child_pose', 30]] };
const SETUP = 10;
const FEEL = { hard: ['😮‍💨', 'Dur'], ok: ['🙂', 'Bien'], easy: ['😎', 'Facile'] };

const blockList = (sid, express) => (express ? SESS[sid].express.map(i => SESS[sid].blocks[i]) : SESS[sid].blocks)
  .map(b => Array.isArray(b) ? { ex: b[0], side: b[1] } : { ex: b });
const sideLabel = (ex, side) => side ? (EX[ex].sides || { D: 'côté droit', G: 'côté gauche' })[side] : '';

function buildPlan(sid, lvN, express) {
  const lv = LEVELS[lvN - 1], blocks = blockList(sid, express), key = express ? 'express' : 'full';
  const st = [{ k: 'ready', ex: WARM[key][0][0], dur: 5 }];
  WARM[key].forEach(([ex, dur]) => st.push({ k: 'warm', ex, dur }));
  blocks.forEach((b, i) => {
    const reps = isReps(b.ex) ? repsFor(b.ex, lvN) : 0;
    st.push({ k: 'rest', ...b, reps, dur: i ? lv.rest : SETUP, setup: !i });
    st.push({ k: 'work', ...b, reps, dur: reps ? Math.round(reps * SEC_PER_REP) + 3 : lv.work, n: i + 1, of: blocks.length });
  });
  COOL[key].forEach(([ex, dur]) => st.push({ k: 'cool', ex, dur }));
  return { sid, lv: lvN, express, steps: st, approx: st.some(counted), total: st.reduce((a, s) => a + (s.k === 'ready' ? 0 : s.dur), 0) };
}
// Avec des séries comptées, la durée n'est qu'une estimation : arrondie à 10 s.
function planLen(plan) {
  return plan.approx ? `≈ ${fmtDur(Math.round(plan.total / 10) * 10)}` : fmtDur(plan.total);
}

const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = d => addDays(d, -((d.getDay() + 6) % 7));
const fmtDur = s => s < 60 ? `${s} s` : `${Math.floor(s / 60)} min${s % 60 ? ' ' + pad(s % 60) : ''}`;
const mmss = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
const fDay = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const fLong = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fMonth = new Intl.DateTimeFormat('fr-FR', { month: 'short' });

const nextSid = () => { const last = S.history.at(-1); return last ? ROT[(ROT.indexOf(last.s) + 1) % ROT.length] : ROT[0]; };
function streaks() {
  const days = new Set(S.history.map(e => e.d));
  let cur = 0, d = new Date();
  if (!days.has(dkey(d))) d = addDays(d, -1);
  while (days.has(dkey(d))) { cur++; d = addDays(d, -1); }
  let best = 0, len = 0, prev = null;
  for (const k of [...days].sort()) { len = prev && dkey(addDays(fromKey(prev), 1)) === k ? len + 1 : 1; best = Math.max(best, len); prev = k; }

let AC = null;
function audio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch {}
  return AC;
}
function tone(f, d, v, delay = 0) {
  const ac = audio();
  if (!ac) return;
  const t = ac.currentTime + delay, osc = ac.createOscillator(), g = ac.createGain();
  osc.type = 'sine'; osc.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  osc.connect(g).connect(ac.destination); osc.start(t); osc.stop(t + d + .03);
}
function beep(kind) {
  if (!S.beep) return;
  if (kind === 'tick') tone(660, .1, .2);
  else if (kind === 'go') tone(990, .38, .26);
  else if (kind === 'rest') tone(520, .32, .2);
  else if (kind === 'end') [523, 659, 784, 1047].forEach((f, i) => tone(f, .32, .22, i * .13));
}
let voiceFr = null;
function say(text) {
  if (!S.voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  voiceFr = voiceFr || speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
  u.lang = 'fr-FR'; u.rate = 1.05;
  if (voiceFr) u.voice = voiceFr;
  speechSynthesis.speak(u);
}
const vibe = p => { if (S.vibe && navigator.vibrate) navigator.vibrate(p); };

  run = { plan, i: 0, t0: performance.now(), el: 0, paused: false, over: false, lastSec: null };
  const pl = $('player');
  pl.style.setProperty('--acc', se.color);
  pl.innerHTML = `<div class="pl-in">
    <div class="pl-top"><button class="icon-btn" data-act="pl-quit" aria-label="Arrêter">${ICON.x}</button>
      <div class="pl-bar" id="plBar">${plan.steps.filter(s => s.k !== 'ready' && s.k !== 'rest').map(s => `<i class="${s.k === 'work' ? '' : 'w'}" style="flex:${s.dur}"></i>`).join('')}</div>
      <button class="icon-btn" data-act="pl-sound" id="plSound" aria-label="Son">${S.voice || S.beep ? ICON.sound : ICON.mute}</button></div>
    <div class="pl-main" id="plMain">
      <div class="pl-phase" id="plPhase"></div>
      <div class="pl-figbox" id="plFigBox"><div class="fig" id="plFig"></div></div>
      <div class="pl-name" id="plName"></div><div class="pl-sub" id="plSub"></div>
      <div class="pl-ring"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="52"/><circle class="rp" id="plRing" cx="60" cy="60" r="52"/></svg><div class="pl-sec"><b id="plSec"></b><small id="plUnit"></small></div></div>
      <div class="pl-cue" id="plCue"></div>
    </div>
    <div class="pl-ctrl" id="plCtrl"><button data-act="pl-prev" aria-label="Précédent">${ICON.prev}</button><button class="pl-play" data-act="pl-pause" id="plPlay" aria-label="Pause">${ICON.pause}</button><button data-act="pl-next" aria-label="Suivant">${ICON.next}</button></div>
    <div class="pl-clock" id="plClock"></div></div>`;
  pl.hidden = false;
  document.body.style.overflow = 'hidden';
  history.pushState({ tonus: 'player' }, '');
  wake();
  enterStep();
  run.iv = setInterval(tick, 200);
}

async function wake() {
  try { if (run && navigator.wakeLock) run.wake = await navigator.wakeLock.request('screen'); } catch {}
}

function enterStep() {
  const s = step(), ex = EX[s.ex], prev = run.plan.steps[run.i - 1];
  run.lastSec = null; run.cue = -1;
  const side = sideLabel(s.ex, s.side), kg = isDb(s.ex) && S.weights[s.ex] ? S.weights[s.ex] + ' kg' : '';
  const ph = { ready: ['Prêt ?', 'var(--mob)'], warm: ['Échauffement', 'var(--mob)'], cool: ['Retour au calme', 'var(--mob)'],
    rest: [s.setup ? 'Installe-toi' : 'Récup', 'var(--muted)'], work: [`Exercice ${s.n} / ${s.of}`, 'var(--acc)'] }[s.k];
  $('plMain').style.setProperty('--ph', ph[1]);
  $('plPhase').textContent = ph[0];
  $('plName').textContent = s.k === 'rest' ? `Ensuite : ${ex.name}` : s.k === 'ready' ? 'Échauffement' : ex.name;
  $('plSub').textContent = s.k === 'ready' ? `${ex.name} pour commencer` : [s.k === 'rest' && s.reps ? `${s.reps} répétitions` : '', side, kg].filter(Boolean).join(' · ');
  const c = counted(s);
  $('plUnit').textContent = c ? 'répétitions' : '';
  $('plPlay').classList.toggle('done', c);
  $('plPlay').innerHTML = c ? `${ICON.check}Fait` : run.paused ? ICON.play : ICON.pause;
  $('plPlay').setAttribute('aria-label', c ? 'Série terminée' : run.paused ? 'Reprendre' : 'Pause');
  $('plFigBox').classList.toggle('rest', s.k === 'rest' || s.k === 'ready');
  const fig = $('plFig');
  fig.removeAttribute('data-on');
  fig.dataset.ex = s.ex;
  fig.dataset.m = s.side === 'G' ? '1' : '';
  mountFigs($('plFigBox'));
  if (run.paused) fig._fig.hold = true;
  const name = ex.name + (side ? ', ' + side : '');
  if (s.k === 'work') { beep('go'); vibe(220); }
  else if (s.k === 'rest') { beep('rest'); vibe([80, 60, 80]); const next = (s.reps ? s.reps + ' ' : '') + name; say(s.setup ? `Installe-toi. Premier exercice : ${next}` : `Récup. Ensuite : ${next}`); }
  else if (s.k === 'warm') { beep('go'); say(prev.k === 'ready' ? `Échauffement. ${name}` : name); }
  else if (s.k === 'cool') { beep('rest'); say(prev.k === 'cool' ? name : `Retour au calme. ${name}`); }
  updateHud(0);
}

function elapsedNow() { return run.paused ? run.el : (performance.now() - run.t0) / 1000; }

function tick() {
  if (!run || run.paused || run.over) return;
  let el = elapsedNow(), moved = false;
  while (!counted(step()) && el >= step().dur) {
    if (run.i >= run.plan.steps.length - 1) return finish(false);
    step().spent = step().dur;
    run.t0 += step().dur * 1000; el -= step().dur; run.i++; moved = true;
  }
  if (moved) enterStep();
  run.el = el;
  updateHud(el);
}

function updateHud(el) {
  const s = step(), c = counted(s), sec = c ? s.reps : Math.max(1, Math.ceil(s.dur - el - 1e-6));
  if (sec !== run.lastSec) {
    $('plSec').textContent = sec;
    if (!c && run.lastSec !== null && sec <= 3) beep('tick');
    run.lastSec = sec;
  }
  const cues = EX[s.ex].cues, ci = s.k === 'rest' || s.k === 'ready' ? 0 : Math.floor(el / 6) % cues.length;
  if (ci !== run.cue) { run.cue = ci; $('plCue').textContent = cues[ci]; }
  const done = run.plan.steps.slice(0, run.i).reduce((a, x) => a + (x.k === 'ready' ? 0 : x.spent ?? x.dur), 0) + (s.k === 'ready' ? 0 : el);
  $('plClock').textContent = `${mmss(done)} / ${run.plan.approx ? '≈' : ''}${mmss(run.plan.total)}`;
  const segs = $('plBar').children;
  let j = 0;
  run.plan.steps.forEach((x, i) => {
    if (x.k === 'ready' || x.k === 'rest') return;
    segs[j++].style.setProperty('--p', i < run.i ? 1 : i === run.i ? Math.min(el / x.dur, c ? .9 : 1) : 0);
  });
  run.doneSec = done;
}

function drawRing(now) {
  const s = step(), el = run.paused ? run.el : (now - run.t0) / 1000;
  $('plRing').style.strokeDashoffset = counted(s) ? 0 : (C * Math.min(Math.max(el / s.dur, 0), 1)).toFixed(1);
}

function jump(i) {
  step().spent = counted(step()) ? elapsedNow() : Math.min(elapsedNow(), step().dur);
  run.i = Math.max(0, Math.min(i, run.plan.steps.length - 1));
  run.t0 = performance.now(); run.el = 0;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  enterStep();
}
function prevStep() {
  if (elapsedNow() > 2) return jump(run.i);
  let i = run.i - 1;
  while (i > 0 && (run.plan.steps[i].k === 'rest' || run.plan.steps[i].k === 'ready')) i--;
  jump(i);
}
function nextStep() {
  if (run.i >= run.plan.steps.length - 1) return finish(false);
  jump(run.i + 1);
}
function setPaused(p) {
  if (!run || run.over || run.paused === p) return;
  if (p) { run.el = elapsedNow(); run.paused = true; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  else { run.t0 = performance.now() - run.el * 1000; run.paused = false; wake(); }
  const f = $('plFig')._fig;
  if (f) f.hold = p;
  if (counted(step())) return;
  $('plPlay').innerHTML = p ? ICON.play : ICON.pause;
  $('plPlay').setAttribute('aria-label', p ? 'Reprendre' : 'Pause');
}

function askQuit() {
  if (!run || run.over || $('plModal')) return;
  setPaused(true);
  const frac = run.doneSec / run.plan.total, pct = Math.round(frac * 100);
  const m = document.createElement('div');
  m.className = 'pl-modal'; m.id = 'plModal';
  m.innerHTML = `<div class="pl-mcard"><h2>Arrêter la séance ?</h2><p>${frac >= .6 ? `Tu en as fait ${pct} % : elle comptera quand même.` : `Tu en es à ${pct} %. Elle ne sera pas comptée.`}</p>
    <div class="row"><button class="btn" data-act="pl-resume">Continuer</button><button class="btn danger" data-act="pl-stop">Arrêter</button></div></div>`;
  $('player').append(m);
}

function finish(partial) {
  clearInterval(run.iv);
  run.over = true;
  try { run.wake?.release(); } catch {}
  const p = run.plan, spent = p.steps.reduce((a, x) => a + (x.k === 'ready' ? 0 : x.spent ?? x.dur), 0);
  const sec = Math.round(partial ? run.doneSec : spent);
  const entry = { at: Date.now(), d: dkey(), s: p.sid, lv: p.lv, x: p.express, sec, feel: null };
  if (partial) entry.partial = true;
  S.history.push(entry);
  save();
  beep('end'); vibe([120, 80, 120, 80, 240]);
  say(partial ? 'Séance arrêtée. C\'est noté quand même.' : 'Séance terminée. Bravo !');
  const { cur } = streaks();
  $('player').innerHTML = `<div class="pl-in"><div class="pl-done">
    <div class="big">${partial ? '👍' : '🎉'}</div><h2>${partial ? 'C\'est noté' : 'Séance terminée !'}</h2>
    <p>${SESS[p.sid].name} · ${fmtDur(sec)} · niveau ${p.lv}</p>
    ${cur > 1 ? `<p class="streak">🔥 ${cur} jours d'affilée</p>` : '<p class="streak">Premier jour d\'une longue série 💪</p>'}
    <p class="feelq">Comment c'était ?</p>
    <div class="feel">${Object.entries(FEEL).map(([k, [em, l]]) => `<button data-act="feel" data-v="${k}" aria-pressed="false">${em}<span>${l}</span></button>`).join('')}</div>
    <button class="go" data-act="pl-close">Terminer</button></div></div>`;
}

function closePlayer(fromPop) {
  const finished = run?.over;
  if (run) { clearInterval(run.iv); try { run.wake?.release(); } catch {} }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  run = null;
  $('player').hidden = true;
  $('player').innerHTML = '';
  document.body.style.overflow = '';
  if (!fromPop && history.state?.tonus === 'player') history.back();
  if (finished) { ui.pick = null; showTab('today'); confetti(); } else render();
}

function confetti() {
  if (REDUCED) return;
  const box = document.createElement('div'), cols = ['var(--push)', 'var(--pull)', 'var(--core)', 'var(--abs)', 'var(--upper)'];
  box.className = 'confetti';
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i');
    p.style.cssText = `left:${44 + Math.random() * 12}%;--x:${(Math.random() * 2 - 1) * 46}vw;--r:${Math.random() * 900 - 450}deg;--d:${1.1 + Math.random()}s;--c:${cols[i % 5]}`;
    box.append(p);
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 2600);
}

/* ---------- interactions ---------- */
document.addEventListener('click', ev => {
  const tabBtn = ev.target.closest('[data-tab]');
  if (tabBtn) return showTab(tabBtn.dataset.tab);
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'start': startSession(el.dataset.sid); break;
    case 'pick': pickSheet(); break;
    case 'choose': ui.pick = el.dataset.sid; closeSheet(); showTab('today'); break;
    case 'fmt': S.express = v === '1'; save(); render(); break;
    case 'level': S.level = +v; save(); render(); break;
    case 'lvlup': S.level++; S.hintAt = S.history.length; save(); render(); break;
    case 'lvlno': S.hintAt = S.history.length; save(); render(); break;
    case 'ex': case 'kg': exSheet(el.dataset.ex); break;
    case 'kgstep': setKg(el.dataset.ex, (S.weights[el.dataset.ex] || 0) + (+v)); break;
    case 'kgset': setKg(el.dataset.ex, +v); break;
    case 'cat': ui.cat = v; render(); break;
    case 'settings': settingsSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'toggle': S[el.dataset.k] = !S[el.dataset.k]; save(); el.setAttribute('aria-checked', S[el.dataset.k]); break;
    case 'theme': S.theme = v; save(); applyTheme(); el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'wipe':
      if (confirm('Effacer tout l\'historique des séances ?')) { S.history = []; S.hintAt = -1; save(); closeSheet(); render(); }
      break;
    case 'del':
      if (confirm('Supprimer cette séance de l\'historique ?')) { S.history = S.history.filter(e => String(e.at) !== el.dataset.at); save(); render(); }
      break;
    case 'pl-pause': if (counted(step())) nextStep(); else setPaused(!run.paused); break;
    case 'pl-prev': prevStep(); break;
    case 'pl-next': nextStep(); break;
    case 'pl-quit': askQuit(); break;
    case 'pl-resume': $('plModal').remove(); setPaused(false); break;
    case 'pl-stop': {
      const keep = run.doneSec / run.plan.total >= .6;
      $('plModal').remove();
      if (keep) finish(true); else closePlayer();
      break;
    }
    case 'pl-sound': {
      const on = !(S.voice || S.beep);
      S.voice = on; S.beep = on; save();
      if (!on && 'speechSynthesis' in window) speechSynthesis.cancel();
      $('plSound').innerHTML = on ? ICON.sound : ICON.mute;
      break;
    }
    case 'feel': {
      S.history.at(-1).feel = v; save();
      el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el));
      break;
    }
    case 'pl-close': closePlayer(); break;
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (!$('sheet').hidden) closeSheet(); else if (run && !run.over) askQuit(); }
  if (ev.key === ' ' && run && !run.over && !$('plModal')) { ev.preventDefault(); if (counted(step())) nextStep(); else setPaused(!run.paused); }
});

addEventListener('popstate', () => {
  if (run && !run.over) { history.pushState({ tonus: 'player' }, ''); askQuit(); }
  else if (run) closePlayer(true);
  else closeSheet(true);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && run && !run.over && !run.paused) { wake(); tick(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

$('today-date').textContent = fLong.format(new Date()).replace(/^./, c => c.toUpperCase());
applyTheme();
showTab('today');
requestAnimationFrame(animate);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register(`sw.js?v=${APP_VERSION}`).catch(() => {});
</script>
</body>
